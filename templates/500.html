{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error del sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar__marca">
            <i class="bi bi-mortarboard-fill"></i>
            <span>Sistema Asistencia</span>
        </div>
    </header>
    <main class="app-content">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 text-center">
                    <div class="card-body p-5">
                        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
                        <h1 class="h3 mt-3">Ocurrió un error en el sistema</h1>
                        <p class="text-secondary">
                            No se pudo completar la operación. Intentá de nuevo en unos minutos;
                            si el problema continúa, avisá al equipo técnico.
                        </p>
                        <a class="btn btn-primario" href="/">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
