{# Que significa cada opcion de la columna "Asistió?" (punto 21). #}
<details class="asis-ayuda mb-3">
    <summary class="fw-semibold" style="cursor: pointer;">
        ¿Qué significa cada opción?
    </summary>

    <ul class="mt-3 list-unstyled">
        {% for marca in marcas %}
            <li class="mb-2">
                <strong>{{ marca.etiqueta }}</strong>
                <span class="text-secondary">(en el papel: {{ marca.codigo }})</span>
                {% if marca.ayuda %}
                    <div class="text-secondary">{{ marca.ayuda }}</div>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</details>
