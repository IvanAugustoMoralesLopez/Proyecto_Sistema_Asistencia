{% comment %}
Un campo de formulario con etiqueta, ayuda y errores.
Uso: {% include "licencias/_campo.html" with campo=form.desde col="col-md-3" %}
{% endcomment %}
<div class="{{ col }}{% if campo.errors %} campo-con-error{% endif %}">
    <label class="form-label" for="{{ campo.id_for_label }}">
        {{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}
        <div class="form-text">{{ campo.help_text }}</div>
    {% endif %}
    {% for error in campo.errors %}
        <div class="text-danger small mt-1">{{ error }}</div>
    {% endfor %}
</div>
