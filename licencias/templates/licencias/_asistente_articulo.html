{{ form.datos_articulos|json_script:"datos-articulos" }}
<script>
(function () {
    const articulos = JSON.parse(document.getElementById('datos-articulos').textContent);
    const selDesignacion = document.getElementById('id_designacion');
    const selArticulo = document.getElementById('id_articulo');
    const panel = document.getElementById('panel-articulo');
    const campoSituacion = document.getElementById('id_sit_rev');
    if (!selDesignacion || !selArticulo || !panel) return;

    // Situación de revista de la designación elegida ('' si no hay o no se conoce).
    function situacionElegida() {
        const opcion = selDesignacion.options[selDesignacion.selectedIndex];
        return opcion ? (opcion.dataset.situacion || '') : '';
    }

    // Copia la situación de revista de la designación al campo de abajo.
    // Con forzar = false solo completa si el campo está vacío: así, al editar,
    // no se pisa lo que la licencia ya tenía guardado.
    // El campo queda de solo lectura cuando la designación tiene situación
    // cargada; si no la tiene, se deja editable para poder escribirla.
    function completarSituacion(forzar) {
        if (!campoSituacion) return;
        const situacion = situacionElegida();
        campoSituacion.readOnly = Boolean(situacion);
        if (!situacion) {
            // La designación elegida no tiene situación cargada: al cambiar de
            // designación se borra la anterior para no dejar un dato equivocado.
            if (forzar) campoSituacion.value = '';
            return;
        }
        if (!forzar && campoSituacion.value) return;
        campoSituacion.value = situacion.charAt(0).toUpperCase() + situacion.slice(1);
    }

    // Muestra planilla, tope, goce, plazo y autoridad del artículo elegido.
    function mostrarPanel() {
        const a = articulos.find(function (x) { return String(x.id) === selArticulo.value; });
        panel.innerHTML = '';
        if (!a) {
            panel.classList.add('d-none');
            return;
        }
        const lineas = [
            ['Planilla de salida', a.planilla_titulo],
            ['Tope anual', a.tope_dias_anual ? a.tope_dias_anual + ' días' : 'Sin tope'],
            ['Goce de haberes', a.goce_haberes],
            ['Plazo', a.plazo],
            ['Autoridad', a.autoridad],
        ];
        lineas.forEach(function (par) {
            const fila = document.createElement('div');
            const titulo = document.createElement('strong');
            titulo.textContent = par[0] + ': ';
            fila.appendChild(titulo);
            fila.appendChild(document.createTextNode(par[1] || '—'));
            panel.appendChild(fila);
        });
        panel.classList.remove('d-none');
    }

    // Arma el desplegable de artículos: solo los de la situación de revista de
    // la designación, agrupados por planilla de salida (IL-01 / IL-02).
    function armarArticulos() {
        const situacion = situacionElegida();
        const actual = selArticulo.value;
        selArticulo.innerHTML = '';

        const vacia = document.createElement('option');
        vacia.value = '';
        vacia.textContent = '---------';
        selArticulo.appendChild(vacia);

        const grupos = {};
        articulos.forEach(function (a) {
            if (situacion && a.situacion !== situacion) return;
            if (!grupos[a.planilla_titulo]) {
                const grupo = document.createElement('optgroup');
                grupo.label = a.planilla_titulo;
                grupos[a.planilla_titulo] = grupo;
                selArticulo.appendChild(grupo);
            }
            const opcion = document.createElement('option');
            opcion.value = a.id;
            opcion.textContent = a.articulo + ' - ' + a.tipo_licencia;
            grupos[a.planilla_titulo].appendChild(opcion);
        });

        selArticulo.value = actual;  // si el artículo ya no corresponde, queda vacío
        mostrarPanel();
    }

    selDesignacion.addEventListener('change', function () {
        completarSituacion(true);
        armarArticulos();
    });
    selArticulo.addEventListener('change', mostrarPanel);
    completarSituacion(false);
    armarArticulos();
})();
</script>
